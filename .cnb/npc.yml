# $ 节点兜底：未指定角色名（@ 路径不带括号角色）或非角色 key 事件时，
# 走默认角色「秘书·接待」——与 .cnb/settings.yml 的 npc.defaultRole 对齐。
$:
  issue.comment@npc: *npc
  pull_request.comment@npc: *npc
