# ============================================================
# 专业秘书团 · NPC 任务配置（v0.3 · 适配新版 dsh 生态）
# ------------------------------------------------------------
# 新版生态：cnpc/dsh（基于 deepseek-harness 官方 CLI 的 CNB NPC 镜像）
#   镜像：docker.cnb.cool/xqitw/docker/npc-dsh:latest
#   入口：sh /app/start.sh（镜像内置，替代平台内置 npc:go 执行器）
#   文档：https://cnb.cool/cnpc/dsh/-/blob/main/docs/integration.md
# ------------------------------------------------------------
# 与 v0.2（npc:go 内置执行器）的差异：
#   1. 执行器：平台内置 npc:go → 自建镜像 npc-dsh
#   2. 角色路由：评论内 [触发:<角色>] 文本命中 → 平台原生「顶层 key = 角色名」
#      （评论 @dongdongxiaozu/zhuanyemishutuan(秘书·评审) 直接命中对应角色）
#   3. 必配 stage timeout：镜像已删除进程级超时，靠 stage timeout 做时间兜底
#   4. 角色提示词经 CNB_NPC_PROMPT 注入；空时镜像回落读 .cnb/settings.yml
#   5. 模型经 DSH_MODEL 注入（dsh 不读该变量，由镜像 --patch 覆盖生效）
#   6. 成本护栏：maxSteps 回合上限 + stage timeout 时间上界（见 §成本护栏）
# ------------------------------------------------------------
# ⚠️ 模型名必须写**带点**的规范名（`deepseek-v4.1-flash`）。
#   写 `deepseek-v4-flash` 会被平台路由到**思考模型**：实测每次请求
#   response_start 中位 7.7 s（对照 1.5 s）、161 次请求折 58 770 毫度，
#   是同期非思考档（17.0 M prompt / 260 次 / 13 360 毫度）的 **33×**。
# ============================================================

# 共用任务环境：镜像、资源规格、服务
# ⚠️ 成本护栏：cpus 是**按核计费**的。NPC 的墙钟由模型往返主导（实测
#   3.3-10.6 s/回合，纯文本工具调用近零 CPU），给 2 核与给 8 核墙钟几乎不变，
#   但核时开销差 4×。历史用 8 核：190 次 NPC 构建合计 744 核时（93 机时），
#   其中 2026-09-10 单小时峰值 111 核时。降到 2 核即 186 核时。
#   若某角色确实需要（如大仓库全量构建），只在**该角色**上单独提核数，
#   不要在共享锚点上提——一处加核 = 7 角色全加。
.npc-job-base: &npc-job-base
  docker:
    image: docker.cnb.cool/xqitw/docker/npc-dsh:latest
  runner:
    cpus: 2
  services:
    - docker

# 基础环境变量（各角色在 env 中 << 合并后追加 DSH_MODEL）
.npc-env: &npc-env
  # dsh 内置 web 工具（web_search + web_fetch 一体）默认禁用，避免误调白耗失败请求
  DSH_WEB_TOOLS: "disable"
  # 图片理解 vision 插件：秘书团角色为纯文本主模型，经 describe_image 副模型识图
  DSH_VISION_ENABLED: "1"
  # ── 成本护栏（实测驱动）────────────────────────────────────────
  # 回合上限：历史最长一次 NPC 跑了 **258 回合 / 45 min / 8 核 = 6.0 核时**，
  # 单次任务即吃掉全仓 NPC 总核时的 0.8%。无上限时 dsh 会"再试一次"直到
  # stage timeout（10 h）——那是一次 80 核时的单点风险。
  # 72 回合覆盖 p50（≈4 min）到 p90（≈20 min）的任务；触顶即**带部分成果收尾**
  # 并在评论里写明未完成项，而不是静默重试。
  DSH_MAX_STEPS: "72"

# 共用执行步骤：脚本、超时与基础环境变量
.base-stage: &base-stage
  script: sh /app/start.sh
  # 必配：镜像已删除业务层进程级超时，时间兜底完全依赖该 stage timeout
  # （CNB Job 未声明 timeout 默认仅 2h，漏配则 dsh 挂死无任何墙钟防线）
  #
  # ⚠️ 成本护栏：10 h 是"防挂死"的兜底值，不是目标值。历史最长一次 45 min，
  #   10 h 意味着单次异常最多烧 2 h × 8 核 = 20 核时（旧规格）。收到 2 h：
  #   NPC 任务超过 2 h 基本已是失控循环，早断早重派比烧满 20 核时划算。
  #   真有长任务需求时，请在**该角色**上单独放宽并说明理由。
  timeout: 2h
  env: *npc-env

# 通用 NPC 事件 job 锚点（不含 DSH_MODEL，由各角色在 stages 中覆盖）
.npc: &npc
  - <<: *npc-job-base
    stages:
      - name: npc go
        <<: *base-stage

# ── 秘书团角色（顶层 key = 角色名，与 .cnb/settings.yml 的 npc.roles[].name 精确一致） ──
# 平台在评论中 @dongdongxiaozu/zhuanyemishutuan(<角色名>) 按同名顶层 key 路由到对应 pipeline。
# 7 个角色共享同一镜像与资源规格，仅按角色语义覆盖 DSH_MODEL（当前统一 deepseek-v4.1-flash，**务必带点**）。

"秘书·接待":
  issue.comment@npc:
    - <<: *npc
      stages:
        - name: npc go
          <<: *base-stage
          env:
            <<: *npc-env
            DSH_MODEL: deepseek-v4.1-flash
  pull_request.comment@npc:
    - <<: *npc
      stages:
        - name: npc go
          <<: *base-stage
          env:
            <<: *npc-env
            DSH_MODEL: deepseek-v4.1-flash

