# ============================================================
# 专业秘书团 · 流水线配置（v0.2）
# 核心机制：Issue/PR 评论 @NPC 触发（issue.comment@npc）→ npc:go 兜底承接
# 循环熔断（v0.3）：评审/修复往返有轮次上界（门禁 3 / 非必要 1 / 总 5 / 停滞 2）
#   熔断后交接 wake=False（静默、不唤醒），恢复仅人工 resume；落地见
#   state-secretary/src/secretary/loop/loop_guard.py
# 评审写回 + 审查范围（v0.4 · Issue #14 补全）：只在开启评审时记版本、冲突只额外处理一个；
#   **日常只审变化，全量只在大版本**（防无效构建/测试）——
#   state-secretary/src/secretary/review/（ReviewArbiter + decide_scan）
# 协同规则（v0.5 · Issue #14 追问，全局跨仓库）：等待阶梯从少到多、10 分钟到顶即停
#   （10s→30s→60s→3min→6min→10min，见 shared/collab/collab-rules.yaml）；
#   **等待不计构建 CPU**——平台计费项只有 CPU 核时与 AI Credits，没有"等待"这一项；
#   等待一律走**平台等待/挂起**语义（如内置任务 cnb:await），本地严禁 sleep / 空转轮询
#   （8 核空转 10 分钟 ≈ 1.33 核时）。落地：state-secretary/src/secretary/collab/
#   （StepBackoff 阶梯 + WaitPolicy 等待策略）、shared/collab/collab-rules.yaml
# 检查点探测（v0.6 · Issue #14 追问）：**非轮询**——
#   形成检查点 → 判断检查点 → 锁/状态变化（cnb:resolve）或到点（平台 crontab）再触发；
#   最多 6 次（= 等待阶梯档位数），用尽即停止自动挂账、交回人工。**永不本地 sleep**。
#   落地：state-secretary/src/secretary/collab/probe.py（CheckpointProbe）
#   平台落点：cnb:await（**≤5min**，零占用）/ crontab（**>5min**，平台代跑）/
#             api_trigger（外部 webhook 再跑）/ 交回人工（resume_required）
# 三点已确认（v0.8 · Issue #14：用户「好的，做吧，都做」）：
#   ① 落点分工**固定不可混用**：≤5min 挂 cnb:await、>5min 交 crontab；
#      **不存在"一律挂 await"**——长等待挂在单个 await 上等于押注对端一定会 resolve，
#      对端不 resolve（人没编辑完/外部系统不回调）就是死等；
#   ② crontab 间隔**固定 */5 一档扫**，**不随阶梯档位放大**（旧 */6、*/10 作废）：
#      与阶梯时间表解耦——阶梯回答"我们何时再看"，cron 只回答"平台多久代跑一次"；
#   ③ 这套 probe 口径在**组织级共享**（shared/collab/organization.yaml，全组织一份），
#      仓库级 shared/collab/collab-rules.yaml **只覆写数值**；跨仓接力**只传判定**，
#      接收方按同一份规则出同一套动作（dispatch_probe_event_shared），不按本地会话号重算
# 增量执行（v0.9 · Issue #14 追问）：**日常只跑增量、同一口径只跑一次**
#   —— 用户口径：「平时不需要跑全量，尤其不适合连跑三次（跑法固定，同一口径不产生分歧）」。
#   机制（非提醒）：`RunScopeGuard` 判 `skip_duplicate` 即**不跑**；
#   想"连跑 N 次"当稳定性论证 → `blocked_stability` + 替代口径
#   （定点/变异探针、独立场景）。规则：shared/collab/*.yaml 的 `scan` 段；
#   执行入口：scripts/ci-incremental-test.sh（接入 main.push，日常唯一跑法）。
#   全量（full）只在**大版本**，日常绝不走。
# 平台语义对齐（v0.10 · Issue #14 本轮）：查证官方文档后发现 `cnb:await` 有两条
#   会让落点失效的硬约束 —— ① 「只能对**同一个事件**触发的 pipeline 做 await/resolve」；
#   ② 「一个 `key` **仅能 resolve 一次**」。故落点判定**先过平台约束**（`resolve_driver()`）：
#   配不上对 → **降级 crontab**（平台代跑 + 平台死锁检测兜底），await key **按轮次唯一**
#   （`probe:<checkpoint>:r<attempt>`）；`cnb:await` 还必须位于 `stages`（endStages/failStages 不生效）。
#   出处：/zh/build/internal-steps/cnb/await-resolve.md
#   同时对齐官方**增量**最佳实践（SCA 插件：「同一组件同一 CVE 不重复阻断」、
#   「内容未变化的文件重命名不重复产生」）→ 评审侧**同一问题不报第二遍**（评审项指纹），
#   执行侧**能力降级保守放行**（判不出受影响面就不做增量判重；漏跑比多跑危险）。
# 组织级分发（v0.10）：`scripts/distribute-collab-rules.sh`（默认 dry-run，`--apply` 才写；
#   只铺组织级基线，**不覆盖**各仓已有的数值覆写）——各仓库通用。
# 全量门禁（v0.11 · Issue #14 本轮追问）：**默认全量根本不跑**，不是"默认不跑"。
#   上一轮只做了 `default_mode: scan`（= **默认值**，不是门禁：调用方显式给
#   `CNB_SCOPE=full` 就绕过）与 `RunScopeGuard` 判重（判重键含 `revision`，
#   **每改一行代码 revision 就变 → 每次都算新口径 → 每次都放行**）。
#   本轮补两道硬闸：
#   ① `decide_full()` 门禁：`full` 必须同时满足「大版本事实 + 可采信来源
#      （action / tag / operator，**agent 自述不算**）+ 代码推进类事件」，
#      否则 `blocked_full` 并给出**可直接跑**的增量命令（拦了但给路）。
#      ⚠️ 方向与判重相反：判重判不出 → **保守放行**；全量判不出 → **保守拦截**。
#   ② 去升级口径 `scan.repeat_scope: content`：同一份**受审内容**跨版本只跑一次
#      （修掉"每开发一步就跑一次 600 多项验证"）。
#   对外只暴露一条命令 `scripts/ci-dispatch.sh`：不接收"全量"参数，
#   没有 `run:` 输入 → 恶意/误用输入改不了执行路径。
#   规则：`shared/collab/*.yaml` 的 `scan.repeat_scope / blocked_events /
#   pipeline_allowlist`；落地：`collab/full_gate.py` + `collab/platform.py`。
# 角色定义见 .cnb/settings.yml（秘书· 命名空间）
# ============================================================

main:
  push:
    - docker:
        image: node:20
      volumes:
        - /root/.npm:copy-on-write
      stages:
        - echo "秘书团流水线已启动"
        - node -v
        # **增量测试（日常唯一跑法）**：只跑本 PR/本次推送**变更相关**的用例，
        # 不跑全量、更不连跑同一命令（跑法固定 → 重复跑不产生判别力）。
        # 全量只在**大版本**（major-version 标签 / 显式触发）。
        # 口径（机制，非提醒）：`RunScopeGuard.decide()` 同口径第 2 次起 skip_duplicate；
        # "连跑 N 次"当稳定性论证 → blocked_stability + 替代口径
        # （定点/变异探针、独立场景）。规则见 shared/collab/*.yaml。
        - python3 --version || true
        # **唯一的执行入口**：不接收"全量"参数（全量只能由大版本流程显式触发），
        # 因此不存在"通过传参绕过全量门禁"的路径。
        # `utils:params` 只用于**观测**（打印本次拿到的参数），不参与执行。
        - ./scripts/ci-dispatch.sh

# Issue / PR 评论触发（**只做秘书接待，不做测试**）
# —— 防跨仓污染的直接堵口：评论类事件**没有基线、也没有变更集**，
#    在这里跑任何测试（尤其全量回归）都是纯空烧，且会污染所有接了这套配置的仓库。
.npc_comment_task: &npc_comment_task
  name: secretary npc comment
  stages:
    - name: npc go
      type: npc:go
      options:
        role: "秘书·接待"
        userPrompt: |
          这是一次**评论触发的秘书接待**（不是一次验证/回归）。
          - 日常一律**只跑增量**（变更相关用例 + 受影响面），**不得跑全量**；
          - 需要判断"能不能跑全量"时用 `full_decision(major_version=…, source=…, event=…)`：
            只有【大版本事实 + 可采信来源（action/tag/operator）+ 代码推进类事件】
            三者同时成立才放行，否则会被判 `blocked_full` 并给出可直接跑的增量命令；
            **不得把"我觉得这是大版本"当事实**（agent 自述不构成凭据）。
          - 评论/目录/定时/触发类事件**不得**跑全量；
          - 同一份**受审内容**跨版本只跑一次（去升级口径 `content`）。

# NPC 任务兜底（Issue/PR 评论 @NPC 触发）
.npc_task: &npc_task
  name: secretary npc
  stages:
    - name: npc go
      type: npc:go
      options:
        role: "秘书·接待"   # 默认入口；按评论内 [触发:<角色>] 命中对应角色

# 检查点探测的空跑占位（平台 **crontab** 触发时无需 Docker 化工作负载：
# 探测判定由 npc:go 的秘书角色执行——读取检查点、采集轻量事实、给出下一步）。
.probe_task: &probe_task
  name: checkpoint probe
  stages:
    - name: probe checkpoint
      type: npc:go
      options:
        role: "秘书·会话"
        userPrompt: |
          这是一次**检查点探测**（非轮询、非新需求）：
          - 检查点 KEY：$CHECKPOINT_KEY（载荷：$PROBE_PAYLOAD）
          - 只做三件事：① 读 `checkpoints_overview()`；② 用 `probe_checkpoint()`
            采集轻量事实并判定；③ 按 `dispatch_probe_event()` 的落点执行下一步。
          - 判定只看**可判定事实**（锁在不在 / 版本变没变 / 我方还等不等），
            **不看自述、不做推测**；判不出就保持等待，不误判为"已完成"。
          - 仍未满足 → **按固定分工**挂 `cnb:await`（≤5min，走 `api_trigger_probe_wait`
            的 await 片）或交 `crontab`（>5min，**固定 `*/5` 一档扫**）；
            条件满足 → 触发一次真正干活的流水线；
            预算用尽（最多 6 次）→ 停止自动挂账、交回人工。
          - **探测预算跨容器继承（必做）**：本任务是**新容器**，本地
            `data/probe/*.json` 是空的 → `checks_used` 会从 0 开始，"最多 6 次"永不触发。
            故必须：① 从评论/交接卡里取上一次的 `<!-- probe-budget: … -->` 留痕；
            ② 调 `probe_checkpoint(key, external_checks=<上次 checks_used>)` 合并预算；
            ③ 把本次 `dispatch_probe_event(...)["budget_trail"]` **写回评论**。
            没有第 ③ 步，下一棒又会归零（等于把软约束换了个位置）。
          - **跨仓接力只传判定**（wait/proceed/release/unknown），接收方按组织级同一份规则
            算落点（`dispatch_probe_event_shared()`），**不按自己的本地会话号重算**；
            判不出/非法判定一律 `unknown` → 继续等，**不得当成放行**。
          - **严禁本地 sleep / 空转轮询**（等待一律走平台挂起语义，否则按 CPU 核时计费）。

# 「等锁」的零占用等待：`cnb:await` 挂起，由对端 `cnb:resolve` 在锁释放时唤醒。
# 说明（官方硬约束，本轮对齐）：`cnb:await`/`cnb:resolve` **只能配合同一事件**触发的
#   pipeline；跨事件（如 push 放锁）**配不上对、会永远等不到** ——
#   请用 `cnb:apply` / `cnb:trigger` 触发 `api_trigger_probe_*`，
#   或按 `await_plan()` 的判定**降级 `crontab`**（平台代跑 + 平台死锁检测兜底）。
.await_lock_task: &await_lock_task
  name: await lock release
  stages:
    - name: await lock
      type: cnb:await
      options:
        key: $CHECKPOINT_AWAIT_KEY
      exports:
        verdict: PROBE_VERDICT
    - name: resume work
      type: npc:go
      options:
        role: "秘书·会话"
        userPrompt: |
          检查点 $CHECKPOINT_KEY 的等待已由 `cnb:resolve` 唤醒（对端状态已变化）。
          只做一件事：`probe_checkpoint("$CHECKPOINT_KEY")` 复核一次；
          判定 `proceed` 才继续干活，否则回到等待（不空转）。

# $ 节点：仓库级事件绑定 + 云原生开发环境声明
$:
  # **≤5min 的等待落点**：挂 `cnb:await` 零占用（由对端 `cnb:resolve` 唤醒）。
  # 🟡3 修复：`.await_lock_task` 此前**定义后无人引用**（`*await_lock_task` 出现 0 次）
  # → 「≤5min 挂 await」这条口径只写在文档里、**未接线**，与 §2.2.2 的
  # 「落点分工固定不可混用」不闭合。这里补上引用：await 片由本事件承载，
  # 与 `crontab`（>5min）**互斥不混用**（await 行不带 cron，crontab 行必带）。
  api_trigger_probe_wait:
    - *await_lock_task
  # **平台定时任务（crontab）一档扫**：固定 `*/5`（= 平台 5 分钟下限），
  # 承载"长等待(>5min)交平台代跑一次探测"——平台才是那个"不睡觉的进程"。
  # 口径固定：不随等待阶梯档位放大（否则换阶梯就改了平台的代跑节奏）。
  crontab:
    - cron: "*/5 * * * *"
      # 仅支持**明确单一分支**（平台约束）
      branch: main
      event: api_trigger_probe_check
  # 外部 webhook / 平台定时任务驱动的**再触发入口**（承载"检查点再跑"）
  api_trigger_probe_check:
    - *probe_task
  api_trigger_probe_resume:
    - *probe_task
  issue.comment@npc:
    - *npc_comment_task
  pull_request.comment@npc:
    - *npc_comment_task
  issue.open:
    - *npc_comment_task
  issue.update:
    - *npc_comment_task
  vscode:
    - docker:
        image: node:20
      services: [vscode]
      stages:
        - echo "云原生开发环境就绪"
