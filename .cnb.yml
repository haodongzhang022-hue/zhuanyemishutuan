# ============================================================
# 专业秘书团 · 流水线配置（v0.3 · 适配新版 dsh 生态）
# ------------------------------------------------------------
# NPC 接入：新版 dsh 生态（cnpc/dsh 镜像）——见 .cnb/npc.yml
#   角色定义：.cnb/settings.yml（秘书· 命名空间，defaultRole = 秘书·接待）
#   触发：Issue/PR 评论 @dongdongxiaozu/zhuanyemishutuan(<角色名>)
#   兜底：$ 段 issue.comment@npc / pull_request.comment@npc → 默认角色
# 迁移说明：v0.2 使用平台内置 npc:go 执行器；v0.3 改用 npc-dsh 自建镜像，
#   角色路由由「评论文本 [触发:<角色>]」升级为平台原生「顶层 key = 角色名」。
# ============================================================

include:
  - .cnb/npc.yml

main:
  push:
    - docker:
        image: node:20
      volumes:
        - /root/.npm:copy-on-write
      stages:
        - echo "秘书团流水线已启动"
        - node -v

# $ 节点：仓库级事件绑定 + 云原生开发环境声明
# （NPC 事件已在 .cnb/npc.yml 中按角色定义，此处不重复声明）
$:
  vscode:
    - docker:
        image: node:20
      services: [vscode]
      stages:
        - echo "云原生开发环境就绪"
