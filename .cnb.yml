# ============================================================
# 专业秘书团 · 流水线配置（v0.2）
# 核心机制：Issue/PR 评论 @NPC 触发（issue.comment@npc）→ npc:go 兜底承接
# 角色定义见 .cnb/settings.yml（秘书· 命名空间）
# ============================================================

main:
  push:
    - docker:
        image: node:20
      volumes:
        - /root/.npm:copy-on-write
      stages:
        - echo "秘书团流水线已启动"
        - node -v

# NPC 任务兜底（Issue/PR 评论 @NPC 触发）
.npc_task: &npc_task
  name: secretary npc
  stages:
    - name: npc go
      type: npc:go
      options:
        role: "秘书·接待"   # 默认入口；按评论内 [触发:<角色>] 命中对应角色

# $ 节点：仓库级事件绑定 + 云原生开发环境声明
$:
  issue.comment@npc:
    - *npc_task
  pull_request.comment@npc:
    - *npc_task
  issue.open:
    - *npc_task
  issue.update:
    - *npc_task
  vscode:
    - docker:
        image: node:20
      services: [vscode]
      stages:
        - echo "云原生开发环境就绪"